<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Fakestore</title>
</head>
<body>
    <div class="login">
        <h1>Bienvenido a la Fakestore</h1>

        <div class="cajalogin">

            <label for="logcorreo">Correo:</label>
            <input type="text" id="logcorreo" placeholder="EJ: manolo@gmail.com">
            <label for="logcontraseña">Contraseña:</label>
            <input type="text" id="logcontraseña" placeholder="EJ: Manolito1234">
            <button id="btnlogin">Loguearse</button>
        </div>
    </div>


    <script src="javascript.js"></script>
</body>
</html>
