<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Fakestore</title>
</head>
<body>
    <div class="register">
        <h1>Bienvenido a la Fakestore</h1>
        <h2>Tu tienda pirata de confianza :D</h2>
        <form class="cajaregister">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="EJ: Manolo">
            <label for="correo">Correo:</label>
            <input type="text" id="correo" placeholder="EJ: manolo@gmail.com">
            <label for="contraseña">Contraseña:</label>
            <input type="text" id="contraseña" placeholder="EJ: Manolito1234">
            <button  type="submit"id="btnregister">Registrar</button>
        </form>
    </div>


    <script src="/js/javascript.js"></script>
</body>
</html>
